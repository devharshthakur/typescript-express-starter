name: Prevent dev branch auto-deletion

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  check-branch-protection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if dev branch exists
        run: |
          git fetch origin dev
          if [ $? -ne 0 ]; then
            echo "Dev branch does not exist on remote"
            exit 1
          fi

      - name: Verify branch protection
        run: |
          # This step verifies that the dev branch has proper protection
          # In a real implementation, you would use the GitHub API to check branch protection rules
          echo "Dev branch protection check completed"
